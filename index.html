<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Clicker</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin: 10px 0 5px; color: #58a6ff; }
    .stats {
      font-size: 1.5rem;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .sub-stats {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    #click-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 4px solid #58a6ff;
      background: radial-gradient(circle, #1f6feb 0%, #0d1117 100%);
      color: white;
      font-size: 3.5rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(88, 166, 255, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      position: relative;
      margin-bottom: 30px;
    }
    #click-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.8);
    }
    .shop {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .upgrade {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .upgrade:hover:not(.disabled) {
      background: #1f242c;
      border-color: #58a6ff;
    }
    .upgrade.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .upgrade-info h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .upgrade-info p { margin: 0; font-size: 0.85rem; color: #8b949e; }
    .upgrade-cost {
      font-weight: bold;
      color: #3fb950;
      font-size: 1.05rem;
      text-align: right;
    }
    .upgrade-count {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
    }
    .floating-text {
      position: fixed;
      color: #58a6ff;
      font-weight: bold;
      font-size: 1.2rem;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }
    #reset-btn {
      margin-top: 30px;
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    #reset-btn:hover { color: #f85149; border-color: #f85149; }
  </style>
</head>
<body>

  <h1>Energy Core</h1>
  <div class="stats"><span id="score">0</span> Energy</div>
  <div class="sub-stats">
    Per Click: <span id="cpc">1</span> | Per Sec: <span id="cps">0</span>
  </div>

  <button id="click-btn">⚡</button>

  <div class="shop" id="shop"></div>

  <button id="reset-btn" onclick="resetGame()">Reset Save</button>

  <script>
    let state = {
      score: 0,
      cpc: 1,
      cps: 0,
      upgrades: [
        { id: 'cursor', name: 'Overcharged Gloves', desc: '+1 Energy per click', cost: 15, count: 0, type: 'click', power: 1 },
        { id: 'bot', name: 'Auto-Drone', desc: '+2 Energy per second', cost: 50, count: 0, type: 'auto', power: 2 },
        { id: 'reactor', name: 'Plasma Coil', desc: '+10 Energy per click', cost: 250, count: 0, type: 'click', power: 10 },
        { id: 'station', name: 'Orbital Array', desc: '+25 Energy per second', cost: 1000, count: 0, type: 'auto', power: 25 },
        { id: 'star', name: 'Dyson Sphere', desc: '+150 Energy per second', cost: 7500, count: 0, type: 'auto', power: 150 }
      ]
    };

    // Load saved progress if available
    const saved = localStorage.getItem('energyClickerSave');
    if (saved) {
      try { state = JSON.parse(saved); } catch (e) {}
    }

    const scoreEl = document.getElementById('score');
    const cpcEl = document.getElementById('cpc');
    const cpsEl = document.getElementById('cps');
    const shopEl = document.getElementById('shop');
    const clickBtn = document.getElementById('click-btn');

    clickBtn.addEventListener('click', (e) => {
      state.score += state.cpc;
      spawnFloatingText(e.clientX, e.clientY, `+${formatNum(state.cpc)}`);
      updateUI();
    });

    function buyUpgrade(index) {
      const upg = state.upgrades[index];
      if (state.score >= upg.cost) {
        state.score -= upg.cost;
        upg.count++;
        if (upg.type === 'click') state.cpc += upg.power;
        if (upg.type === 'auto') state.cps += upg.power;
        upg.cost = Math.floor(upg.cost * 1.35);
        renderShop();
        updateUI();
      }
    }

    function spawnFloatingText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = `${x - 15}px`;
      el.style.top = `${y - 20}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function formatNum(num) {
      return Math.floor(num).toLocaleString();
    }

    function renderShop() {
      shopEl.innerHTML = '';
      state.upgrades.forEach((upg, i) => {
        const div = document.createElement('div');
        div.className = 'upgrade' + (state.score < upg.cost ? ' disabled' : '');
        div.id = `upg-${i}`;
        div.onclick = () => buyUpgrade(i);
        div.innerHTML = `
          <div class="upgrade-info">
            <h3>${upg.name}</h3>
            <p>${upg.desc}</p>
          </div>
          <div class="upgrade-cost">
            ⚡ ${formatNum(upg.cost)}
            <span class="upgrade-count">Owned: ${upg.count}</span>
          </div>
        `;
        shopEl.appendChild(div);
      });
    }

    function updateUI() {
      scoreEl.textContent = formatNum(state.score);
      cpcEl.textContent = formatNum(state.cpc);
      cpsEl.textContent = formatNum(state.cps);
      state.upgrades.forEach((upg, i) => {
        const el = document.getElementById(`upg-${i}`);
        if (el) {
          if (state.score >= upg.cost) el.classList.remove('disabled');
          else el.classList.add('disabled');
        }
      });
    }

    // Passive income loop (runs 10 times per second for smooth numbers)
    setInterval(() => {
      if (state.cps > 0) {
        state.score += state.cps / 10;
        updateUI();
      }
    }, 100);

    // Auto-save every 5 seconds
    setInterval(() => {
      localStorage.setItem('energyClickerSave', JSON.stringify(state));
    }, 5000);

    function resetGame() {
      if (confirm('Reset all progress?')) {
        localStorage.removeItem('energyClickerSave');
        location.reload();
      }
    }

    renderShop();
    updateUI();
  </script>
</body>
</html>
